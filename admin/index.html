<!doctype html>
<html lang="en" dir="ltr" data-page="admin">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#060e20" />
    <meta name="description" content="MN local content studio." />
    <meta name="robots" content="noindex,nofollow" />

    <title>MN | Dashboard</title>
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <script src="../assets/js/theme.js"></script>
    <link rel="stylesheet" href="../assets/fonts.css" />
    <link rel="stylesheet" href="../assets/base.css" />
    <link rel="stylesheet" href="../assets/admin.css" />
    <script defer src="../data.js"></script>
    <script defer src="../assets/js/dictionary.js"></script>
    <script defer src="../assets/js/icons.js"></script>
    <script defer src="../admin/auth-config.js"></script>
    <script defer src="../assets/js/common.js?v=2"></script>
    <script defer src="../assets/js/portfolio.js"></script>
    <script defer src="../assets/js/document.js"></script>
    <script defer src="../assets/js/admin.js"></script>
  </head>
  <body>
    <div id="app">
      <div class="language-root" data-locale="en">
        <div class="login-screen">
          <div class="login-top">
            <a href="../index.html"
              ><span class="brand brand-personal" dir="ltr"
                ><svg
                  class="brand-symbol"
                  viewBox="0 0 70 44"
                  aria-label="MN"
                  role="img"
                >
                  <path d="M5 36V8l14 19L33 8v28" />
                  <path d="M43 36V8l22 28V8" /></svg></span
            ></a>
            <div class="login-top-actions">
              <div
                class="language-switch"
                role="group"
                aria-label="Choose language"
                dir="ltr"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-globe"
                  aria-hidden="true"
                >
                  <circle cx="12" cy="12" r="10"></circle>
                  <path
                    d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"
                  ></path>
                  <path d="M2 12h20"></path></svg
                ><button
                  type="button"
                  data-lang="en"
                  lang="en"
                  aria-label="English"
                  aria-pressed="true"
                >
                  EN</button
                ><button
                  type="button"
                  data-lang="tr"
                  lang="tr"
                  aria-label="Türkçe"
                  aria-pressed="false"
                >
                  TR</button
                ><button
                  type="button"
                  data-lang="ar"
                  lang="ar"
                  aria-label="العربية"
                  aria-pressed="false"
                >
                  عربي
                </button>
              </div>
              <button
                class="icon-button theme-toggle"
                type="button"
                data-action="theme-toggle"
                aria-label="Switch to light mode"
                title="Switch to light mode"
                aria-pressed="false"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <circle cx="12" cy="12" r="4" />
                  <path
                    d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"
                  />
                </svg>
              </button>
            </div>
          </div>
          <main class="login-card">
            <div class="login-emblem">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-lock-keyhole"
                aria-hidden="true"
              >
                <circle cx="12" cy="16" r="1"></circle>
                <rect x="3" y="10" width="18" height="12" rx="2"></rect>
                <path d="M7 10V7a5 5 0 0 1 10 0v3"></path>
              </svg>
            </div>
            <span class="eyebrow" dir="ltr">MN / LOCAL STUDIO</span>
            <h1>Dashboard</h1>
            <p>Your independent content editor</p>
            <form id="login-form">
              <label class="field"
                ><span>Username</span
                ><input
                  name="username"
                  autocomplete="username"
                  value=""
                  maxlength="2000"
                  required
                  dir="auto" /></label
              ><label class="field"
                ><span>Password</span
                ><input
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  value=""
                  maxlength="2000"
                  required
                  dir="auto"
              /></label>
              <p id="login-error" class="form-error" role="alert"></p>
              <button class="button primary" type="submit">
                Sign in<svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-arrow-up-right"
                  aria-hidden="true"
                >
                  <path d="M7 7h10v10"></path>
                  <path d="M7 17 17 7"></path>
                </svg>
              </button>
            </form>
            <div class="local-explanation">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-database"
                aria-hidden="true"
              >
                <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
                <path d="M3 5V19A9 3 0 0 0 21 19V5"></path>
                <path d="M3 12A9 3 0 0 0 21 12"></path>
              </svg>
              <p>
                This is a local editor login, not server authentication. Keep
                secrets out of the site files.
              </p>
            </div>
            <a class="text-link" href="../index.html"
              >Back to site<svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-arrow-up-right"
                aria-hidden="true"
              >
                <path d="M7 7h10v10"></path>
                <path d="M7 17 17 7"></path></svg
            ></a>
          </main>
          <span class="login-footer" dir="ltr">MN / CONTENT STUDIO</span>
        </div>
      </div>
    </div>
    <noscript
      ><p class="preview-notice">
        Enable JavaScript to use the content editor.
      </p></noscript
    >
  </body>
</html>
